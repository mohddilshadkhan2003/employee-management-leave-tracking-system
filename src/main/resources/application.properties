spring.application.name=employee-management-leave-tracking-system
server.port=${PORT:8080}

# MySQL connection settings can be overridden with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Initialize the schema on startup for local development.
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Logging
logging.level.org.springframework.jdbc=INFO
logging.level.com.employee.management=INFO
